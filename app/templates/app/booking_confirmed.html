{% extends 'app/base.html' %}

{% block main-content %}

<div class="container text-center my-5">

  <div class="card mx-auto p-4" style="max-width: 500px; 
       background: linear-gradient(180deg,#0e2a2a,#061818);
       border:1px solid rgba(0,255,200,0.3);
       box-shadow:0 0 25px rgba(0,255,200,0.3);
       border-radius:16px;">

    <h2 class="text-success mb-3">✅ Booking Confirmed</h2>

    <p>
      <strong>Parking Area:</strong> {{ slot.parking_lot.title }}
    </p>

    <p>
      <strong>Slot Number:</strong> {{ slot.slot_number }}
    </p>

    {% if token %}
    <p>
      <strong>Booking Token:</strong> 
      <span style="color:#00ffbe; font-size:18px;">
        {{ token }}
      </span>
    </p>
    {% endif %}

    <p class="mt-3 text-light">
      Your parking slot has been successfully reserved.
    </p>

    <a href="{% url 'home' %}" class="btn btn-primary mt-3">
      Go to Home
    </a>

  </div>

</div>

{% endblock %}
