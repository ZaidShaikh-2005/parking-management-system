{% extends 'app/base.html' %}
{% load static %}
{% block title %}Change Password Done{% endblock title %}

{% block main-content %}

<style>
/* ================= PAGE THEME ================= */
body {
    background: radial-gradient(circle at top, #0b3a3a, #021818);
    color: #dffefe;
}

/* ================= HEADINGS ================= */
h3 {
    color: #6fffe9;
    font-weight: 600;
    letter-spacing: 0.8px;
}

/* ================= SIDEBAR ================= */
.col-sm-2 {
    border-right: 1px solid #0aa6a6 !important;
}

.col-sm-2 a.btn {
    background: linear-gradient(135deg, #00c9a7, #00b3b3);
    border: none;
    color: #022;
    font-weight: 600;
    transition: all 0.3s ease;
}

.col-sm-2 a.btn:hover {
    background: linear-gradient(135deg, #00ffe1, #00cfcf);
    box-shadow: 0 0 12px rgba(0, 255, 220, 0.8);
}

/* ================= SUCCESS SECTION ================= */
.col-sm-9 {
    background: linear-gradient(145deg, #052b2b, #031818);
    border: 1px solid #0aa6a6;
    border-radius: 16px;
    box-shadow: 0 0 25px rgba(0, 255, 200, 0.15);
    padding: 40px 20px;
}

/* Success text */
.col-sm-9 h3 {
    color: #7fffd4;
    margin-bottom: 20px;
}

/* Giphy center & glow */
.giphy-embed {
    border-radius: 14px;
    box-shadow: 0 0 20px rgba(0, 255, 200, 0.4);
}
</style>

<div class="container my-5">
 <div class="row">
   <h3>Welcome Zaid</h3>

   <div class="col-sm-2 border-end">
     <ul class="list-unstyled">
       <li class="d-grid">
         <a href="{% url 'profile' %}" class="btn btn-primary">
           Change Password Done
         </a>
       </li>
     </ul>
   </div>

   <div class="col-sm-9 offset-sm-1 text-center">
     <h3>Password Change Successfully</h3>

     <div>
       <iframe 
         src="https://giphy.com/embed/b2VxjMhx8nnjy"
         width="200"
         height="200"
         frameBorder="0"
         class="giphy-embed"
         allowfullscreen>
       </iframe>
     </div>
   </div>
 </div>
</div>

{% endblock main-content %}
