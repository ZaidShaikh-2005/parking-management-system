{% extends 'app/base.html' %}
{% load static %}
{% block title %}Empty Cart{% endblock title %}

{% block main-content %}

<style>
body{
  background: radial-gradient(circle at top, #0f2f2f, #050d0d);
  color:#e6fffa;
}

.empty-box{
  background: linear-gradient(180deg,#0e2a2a,#061818);
  border:1px solid rgba(0,255,200,.3);
  border-radius:16px;
  box-shadow:0 0 25px rgba(0,255,200,.2);
  padding:40px;
}

h3{
  color:#7fffe1;
}

.btn-primary{
  background: linear-gradient(135deg,#00ffbe,#00c9a7);
  border:none;
  color:#002b2b;
  font-weight:bold;
}
</style>

<div class="container my-5 text-center">

  <div class="empty-box mx-auto" style="max-width:500px;">

    <h3 class="mb-3">🚫 No Parking Slots Selected</h3>

    <p class="text-light">
      You have not added any parking slot to your booking yet.
    </p>

    <!-- OPTIONAL IMAGE -->
    <!-- 
    <img src="{% static 'app/images/emptycart.png' %}" 
         class="img-fluid my-3" width="150">
    -->

    <a href="{% url 'home' %}" class="btn btn-primary mt-3">
      Browse Parking Slots
    </a>

  </div>

</div>

{% endblock main-content %}
